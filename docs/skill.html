<script>
const RAW = 'https://raw.githubusercontent.com/maitrithanh/qa-test-agent-skill/main/';
// ngôn ngữ → [thư mục local, thư mục trên GitHub]
const SRC = { en: ['../skills/qa-test-agent/', 'skills/qa-test-agent/'], vi: ['vi/', 'docs/vi/'] };
const T = {
  vi: { load: 'Đang tải…', fail: 'Không tải được file này.', toc: 'Trong trang này', raw: 'Xem file gốc', files: 'Tài liệu' },
  en: { load: 'Loading…', fail: 'Could not load this file.', toc: 'On this page', raw: 'View raw file', files: 'Documents' },
};
const FILES = ['SKILL.md', 'references/first-run.md', 'references/cache.md', 'references/case-design.md', 'references/writing.md', 'references/playwright.md', 'references/nonfunctional.md', 'references/audit.md', 'references/repro.md'];
const main = document.getElementById('md');
const slug = t => t.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/g, '-').replace(/^-|-$/g, '');

function currentFile() {
  const f = new URLSearchParams(location.search).get('f') || 'SKILL.md';
  return /^(SKILL\.md|references\/[a-z-]+\.md)$/.test(f) ? f : 'SKILL.md'; // chặn path lạ
}
async function get(file) {
  const [local, remote] = SRC[lang];
  for (const url of [local + file, RAW + remote + file]) {
    try { const r = await fetch(url); if (r.ok) return await r.text(); } catch {}
  }
  throw new Error('fetch');
}
async function render() {
  const file = currentFile(), t = T[lang];
  main.innerHTML = `<p class="md-meta">${t.load}</p>`;
  try {
    let md = await get(file), meta = '';
    md = md.replace(/^---\n([\s\S]*?)\n---\n/, (_, y) => { const d = /description:\s*(.*)/.exec(y); meta = d ? d[1] : ''; return ''; });
    md = md.replace(/<!--[\s\S]*?-->/g, '');
    const div = document.createElement('div');
    div.innerHTML = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
    div.querySelectorAll('h1,h2,h3,h4').forEach(h => (h.id = slug(h.textContent)));
    div.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'tbl'; tb.replaceWith(w); w.append(tb); });
    div.querySelectorAll('a[href]').forEach(a => {            // link .md nội bộ → mở trong viewer
      const h = a.getAttribute('href');
      if (/^(references\/[a-z-]+\.md|SKILL\.md)(#.*)?$/.test(h)) a.href = 'skill.html?f=' + h.replace(/#.*/, '') + (h.includes('#') ? '#' + h.split('#')[1] : '');
      else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; }
    });
    const bar = document.createElement('div'); bar.className = 'md-bar';
    bar.innerHTML = `<span>${t.files}:</span>` + FILES.map(f => `<a href="skill.html?f=${f}"${f === file ? ' aria-current="true"' : ''}>${f.replace('references/', '').replace('.md', '')}</a>`).join('') + `<a href="${RAW + SRC[lang][1] + file}">${t.raw}</a>`;
    main.replaceChildren(bar, ...div.childNodes);
    const h1 = main.querySelector('h1');
    if (meta && h1) { const p = document.createElement('p'); p.className = 'md-meta'; p.textContent = meta; h1.after(p); }
    const h2s = [...main.querySelectorAll('h2')];
    if (h2s.length > 3 && h1) {
      const toc = document.createElement('nav'); toc.className = 'md-toc'; toc.setAttribute('aria-label', t.toc);
      toc.innerHTML = `<b>${t.toc}</b><ul>${h2s.map(h => `<li><a href="#${h.id}">${h.textContent}</a></li>`).join('')}</ul>`;
      (main.querySelector('.md-meta') || h1).after(toc);
    }
    document.title = (h1 ? h1.textContent : file) + ' — qa-test-agent';
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  } catch { main.innerHTML = `<p class="md-meta">${t.fail}</p>`; }
}
document.addEventListener('langchange', render);
render();
</script>
